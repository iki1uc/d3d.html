<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iki1uc — index — STATION v81 — 81◆→27▣ — BIO→CUBIK</title>
<style>html,body{margin:0;height:100%;background:#050805;color:#b6ffb6;font-family:Calibri,system-ui}#c{width:100%;height:100%;display:block}#h{position:fixed;left:10px;top:10px;background:#0a120a;border:1px solid #1c2e1c;padding:8px 10px;border-radius:8px;font-size:11px;line-height:1.5}a{color:#7dd;text-decoration:none}</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="h"><span id="s">loading BIO→CUBIK</span><br><a href="./bio.js">bio.js</a> · <a href="./bio.ID.js">bio.ID.js</a> · <a href="./ID.html">ID</a> · <a href="./README.md">README</a></div>
<script type="module">
import {bioToCubik} from './index.js';
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true}); renderer.setSize(innerWidth,innerHeight);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x050805);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,100); camera.position.set(4,4,4);
scene.add(new THREE.AmbientLight(0xffffff,0.7));
const b=bioToCubik();
const g=new THREE.Group();
b.slots.forEach(p=>{
  const isInside = Math.abs(p.pos.x)<=1.5 && Math.abs(p.pos.z)<=1.5; // 27 innen
  const col = isInside ? b.color : 0x333333;
  const m=new THREE.Mesh(new THREE.BoxGeometry(0.18,0.18,0.18), new THREE.MeshStandardMaterial({color:col, transparent:true, opacity:b.opacity}));
  m.position.set(p.pos.x, b.gates.g3? b.y*0.1 : 0, p.pos.z);
  g.add(m);
});
scene.add(g);
function loop(){requestAnimationFrame(loop); g.rotation.y+=0.001; renderer.render(scene,camera);
  document.getElementById('s').textContent=`${b.a.quality.grade} score ${b.a.quality.score} arg ${b.a.math.arg.toFixed(1)} cubikInside ${b.cubikInside.toFixed(2)} eco ${b.eco_wert.toFixed(1)} radius ${b.radiusFactor.toFixed(3)}~0.35 gates ${b.gates.all?'alle offen':'wenn nicht dann nicht'} — 81◆→△→27▣→3↺`;
}
loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
