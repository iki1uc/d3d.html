<script type="module">
import {MODULES} from './axiom.map.js';
import {kernel} from './OS_CORE.js';
import {gridPoints} from './NC_space.js';
import {TRI} from './NC_figur.js';
import './room.js';
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
import {OrbitControls} from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setSize(innerWidth,innerHeight);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050505);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,100);camera.position.set(0,8,0);camera.lookAt(0,0,0);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
scene.add(new THREE.AmbientLight(0xffffff,0.8));
// ID — 81 Slots — 9×9-Respo-Mesh — BEST?MATRIX — ram.lauf.ready slot definitions
const slots81=gridPoints(9,9,1); // 9×9=81 — 81◆ außen — ram.sys 81◆
const slots27=gridPoints(3,3,3,1); // 3×3×3=27 — 27▣ Cubik innen muss — cubik ram nach innen
const g=new THREE.Group();
slots81.forEach(p=>{
  const isCubik = Math.abs(p.pos.x)<=1.5 && Math.abs(p.pos.z)<=1.5; // innen 27
  const col = isCubik ? 0xffcc33 : 0x333333;
  const m=new THREE.Mesh(new THREE.BoxGeometry(0.18,0.18,0.18),new THREE.MeshStandardMaterial({color:col}));
  m.position.set(p.pos.x,0,p.pos.z); m.userData={id:`${p.row}-${p.col}`, cubik:isCubik};
  g.add(m);
});
scene.add(g);
function loop(){requestAnimationFrame(loop);kernel.clock.tick();g.rotation.y+=0.001;controls.update();renderer.render(scene,camera);document.getElementById('s').textContent=`ID 81 Slots ${slots81.length} — 27▣ Cubik innen ${slots27.length} — TRI ${TRI.join('°/')}° — ${kernel.clock.seconds.toFixed(1)}s — W=9 81◆→△→27▣→3↺ — cubik ram nach innen muss`;}
kernel.clock.reset();loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
console.log('id.html — ID — MODULES',MODULES,'81 Slots',slots81.length,'27 Cubik',slots27.length,'room.js bleibt so');
</script>
