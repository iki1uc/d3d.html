  const canvas=wrap.querySelector('#matrixCanvas'),svg=wrap.querySelector('#matrixSvg');
  function redraw(){svg.innerHTML='';state.matrix.edges.forEach(e=>{const a=state.matrix.nodes.find(n=>n.id===e.a),b=state.matrix.nodes.find(n=>n.id===e.b);if(!a||!b) return;const line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',a.x+'%');line.setAttribute('y1',a.y+'%');line.setAttribute('x2',b.x+'%');line.setAttribute('y2',b.y+'%');line.setAttribute('stroke','rgba(212,175,55,.35)');line.setAttribute('stroke-width','1');line.setAttribute('stroke-dasharray','4 4');svg.appendChild(line);});$$('.matrix-node',canvas).forEach(n=>n.remove());state.matrix.nodes.forEach(n=>{const el=document.createElement('div');el.className='matrix-node';el.style.left=n.x+'%';el.style.top=n.y+'%';el.innerHTML=`<span>${esc(n.name[0])}</span><span class="lbl">${esc(n.name)}</span>`;canvas.appendChild(el);el.addEventListener('mousedown',ev=>{matrixDrag={id:n.id,el};el.classList.add('sel');ev.preventDefault();});});}
  window.addEventListener('mousemove',ev=>{if(!matrixDrag) return;const rect=canvas.getBoundingClientRect();const x=Math.max(0,Math.min(100,((ev.clientX-rect.left)/rect.width)*100));const y=Math.max(0,Math.min(100,((ev.clientY-rect.top)/rect.height)*100));const node=state.matrix.nodes.find(n=>n.id===matrixDrag.id);if(node){node.x=x;node.y=y;matrixDrag.el.style.left=x+'%';matrixDrag.el.style.top=y+'%';redraw();}});window.addEventListener('mouseup',()=>{if(matrixDrag){matrixDrag.el.classList.remove('sel');matrixDrag=null;}});
  wrap.querySelector('#matrixAdd').addEventListener('click',()=>{state.matrix.nodes.push({id:'n'+Date.now(),name:'Neu',x:50,y:50});redraw();});
  redraw();
}
function renderWorld(root){
  const g=BIO.check();
  const hdr=document.createElement('div');hdr.className='view-hdr layer-aussen';hdr.innerHTML=`<h2>WORLD · 81 · ${esc(state.world._title)}</h2><div style="display:flex;gap:6px"><span class="badge on">${state.world.cells.length}</span><button id="worldRegen">REGEN</button><span class="badge on" style="background:${g.color};color:#000">${g.good}</span></div>`;root.appendChild(hdr);
  hdr.querySelector('#worldRegen').addEventListener('click',()=>{initWorldCells();renderWorld($('#center').firstChild);});
  const body=document.createElement('div');body.className='view-body';root.appendChild(body);
  const bio=document.createElement('div');bio.className='bio-bar';bio.innerHTML=[{k:'aura',v:g.aura},{k:'mana',v:g.mana},{k:'zen',v:g.zen},{k:'cpu',v:g.cpu},{k:'ram',v:g.ram},{k:'rom',v:g.rom},{k:'gpu',v:g.gpu}].map(x=>`<div><div class="k">${x.k}</div><div class="v">${x.v}%</div></div>`).join('')+`<div style="grid-column:span 7;background:#000;padding:6px;font-size:10px;color:${g.color}">${esc(g.text)} — move = (cpu+ram+rom+gpu+aura)/5 — nicht Hardware kontrollieren — wenn unter 60fps fällt nicht nur leicht auf — alle Tore offen</div>`;body.appendChild(bio);
  const title=document.createElement('div');title.className='world-section-title layer-aussen';title.innerHTML=`<span>81 · RESPO-Grid · 9×9 · ${g.tore}</span><span class="badge">${g.fps}fps</span>`;body.appendChild(title);
  const gridWrap=document.createElement('div');gridWrap.className='world-grid-wrap layer-mitte';gridWrap.innerHTML=`<div class="world-grid" id="worldGrid"></div>`;body.appendChild(gridWrap);
  const gridEl=gridWrap.querySelector('#worldGrid');
  state.world.cells.forEach(cell=>{const color=state.world.colors[cell.cat]||'var(--line)';const el=document.createElement('div');el.className='world-cell';el.innerHTML=`<div class="wc-top"><span class="wc-id">${esc(cell.id)}</span><span class="wc-cat" style="border-color:${color};color:${color}">${esc(cell.cat.slice(0,4).toUpperCase())}</span></div><div class="wc-score"><input type="number" step="0.1" value="${cell.score}"></div><div style="font-size:8px;color:var(--muted)">QI ${cell.qi} IQQ ${cell.iqq}</div><div class="wc-bottom"><input value="${cell.codec}"><div class="wc-bar"><div style="width:${Math.min(100,cell.score)}%;background:${color}"></div></div></div>`;gridEl.appendChild(el);});
  const topTitle=document.createElement('div');topTitle.className='world-section-title';topTitle.innerHTML=`<span>TOP 10 / TOP 100</span><span class="badge">${state.world.topRows.length}</span>`;body.appendChild(topTitle);
  const topCard=document.createElement('div');topCard.className='world-card layer-mitte';topCard.innerHTML=`<div class="world-card-hdr"><span>Kompetenz-Ranking</span><div style="display:flex;gap:6px"><button data-top="10">Top 10</button><button data-top="100">Top 100</button></div></div><div style="max-height:300px;overflow:auto"><table class="world-table"><thead><tr><th>#</th><th>Label</th><th>Score</th><th>Cat</th><th>Funktion</th><th>Optik</th></tr></thead><tbody id="topBody"></tbody></table></div>`;body.appendChild(topCard);
  const topBody=topCard.querySelector('#topBody');state.world.topRows.forEach((r,idx)=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${idx+1}</td><td>${esc(r.label)}</td><td>${r.score.toFixed(1)}</td><td>${esc(r.cat)}</td><td>${r.funktion}</td><td>${r.optik}</td>`;topBody.appendChild(tr);});
  topCard.querySelectorAll('[data-top]').forEach(btn=>{btn.addEventListener('click',()=>{const m=btn.dataset.top;if(m==='10') state.world.topRows=buildTopRows(10);if(m==='100') state.world.topRows=buildTopRows(100);renderWorld($('#center').firstChild);});});
}
function renderPlaceholder(root,id){root.innerHTML=`<div class="view-hdr"><h2>${esc(id)}</h2><span class="badge">Plug-in</span></div><div class="view-body"><div style="border:1px dashed var(--line);padding:40px;text-align:center;color:var(--muted)">Sphäre ${esc(id)} — Plug-in — Block 3 später</div></div>`;}
function renderDetail(id){
  const detail=$('#detail');
  if(id==='WORLD'){
    const cells=state.world.cells;const avg=cells.length?(cells.reduce((a,c)=>a+c.score,0)/cells.length):0;const g=BIO.check();
    detail.innerHTML=`<div class="dsec"><h3>WORLD · 81 — JEDI</h3><div class="drow"><span>Zellen</span><b>${cells.length}</b></div><div class="drow"><span>Ø Score</span><b>${avg.toFixed(2)}</b></div><div class="drow"><span>GOOD</span><b style="color:${g.color}">${g.good}</b></div><div class="drow"><span>FPS</span><b>${g.fps} — ${g.tore}</b></div></div><div class="dsec"><h3>BIO — aura mana zen cpu ram rom gpu</h3>${[{k:'aura',v:g.aura},{k:'mana',v:g.mana},{k:'zen',v:g.zen},{k:'cpu',v:g.cpu},{k:'ram',v:g.ram},{k:'rom',v:g.rom},{k:'gpu',v:g.gpu},{k:'move',v:g.move}].map(x=>`<div class="drow"><span>${x.k}</span><b style="color:var(--gold)">${x.v}%</b></div>`).join('')}<div style="font-size:9px;margin-top:8px;color:var(--muted)">${esc(g.text)}<br><br>move = (cpu+ram+rom+gpu+aura)/5 — nicht was drin ist — sondern was Geräte bereitstellen — nicht Hardware kontrollieren — unter 60fps fällt nicht nur leicht auf</div></div><div class="dsec"><h3>Kompetenz</h3>${state.world.kompetenz.map(k=>`<div class="drow"><span style="color:${k.color}">${esc(k.key)}</span><b>${(k.weight*100).toFixed(0)}%</b></div>`).join('')}</div>`;
    return;
  }
  if(id==='HOME'){
    const g=BIO.check();
    detail.innerHTML=`<div class="dsec"><h3>HOME · 3 — JEDI</h3><div class="drow"><span>GOOD</span><b style="color:${g.color}">${g.good}</b></div><div class="drow"><span>FPS</span><b>${g.fps}</b></div><div class="drow"><span>Move</span><b>${g.move}</b></div></div><div class="dsec"><h3>aura mana zen</h3><div class="drow"><span>aura</span><b>${g.aura}%</b></div><div class="drow"><span>mana</span><b>${g.mana}%</b></div><div class="drow"><span>zen</span><b>${g.zen}%</b></div></div><div class="dsec"><h3>cpu ram rom gpu</h3><div class="drow"><span>cpu</span><b>${g.cpu}%</b></div><div class="drow"><span>ram</span><b>${g.ram}%</b></div><div class="drow"><span>rom</span><b>${g.rom}%</b></div><div class="drow"><span>gpu</span><b>${g.gpu}%</b></div><div style="margin-top:8px;font-size:9px;color:var(--muted)">move = (cpu+ram+rom+gpu+aura)/5 — was bereitstellt — nicht Hardware</div></div>`;
    return;
  }
  detail.innerHTML=`<div class="dsec"><h3>${esc(id)}</h3><div class="drow"><span>Status</span><b>Plug-in</b></div></div>`;
}
function initHeader(){
  $('#hdrTitle').addEventListener('input',e=>{state.header.title=e.target.value;document.title='Ω · '+e.target.value;});
  $$('#modeToggle button').forEach(btn=>{btn.addEventListener('click',()=>{$$('#modeToggle button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');state.ui.mode=btn.dataset.mode;document.body.dataset.mode=state.ui.mode;});});
  $('#searchInput').addEventListener('input',e=>{state.ui.search=e.target.value.trim();let hits=0;const q=state.ui.search.toLowerCase();$$('.world-cell').forEach(c=>{if(!q){c.style.opacity=1;return;}const txt=c.textContent.toLowerCase();const m=txt.includes(q);c.style.opacity=m?1:.2;if(m) hits++;});$('#searchCount').textContent=hits;});
  $('#exportBtn').addEventListener('click',()=>{const blob=new Blob([document.documentElement.outerHTML],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='iki1uc-jedi-v81.html';a.click();toast('EXPORTED JEDI v81');});
}
function tick(){
  const g=BIO.check();
  $('#fpsBadge').textContent=g.fps+'fps';
  $('#fpsBadge').style.borderColor=g.fps>=60?'var(--gold)':'var(--red)';
  $('#fpsBadge').style.color=g.fps>=60?'var(--gold)':'var(--red)';
  $('#goodBadge').textContent='GOOD '+g.good;
  $('#goodBadge').style.background=g.color;
  $('#goodBadge').style.color='#000';
  $('#bioText').textContent=g.text;
  $('#fieldCount').textContent=fieldRegistry.size+state.world.cells.length;
  $('#clock').textContent=new Date().toTimeString().slice(0,8);
  requestAnimationFrame(tick);
}
function init(){initHeader();renderMenu();activate('HOME');tick();setInterval(()=>{$('#clock').textContent=new Date().toTimeString().slice(0,8);},1000);}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
