<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>d3d STATION v81 ZONE 27▣</title>
<style>
html,body{margin:0;background:#02060a;color:#e6e6d6;font:11px/1.4 JetBrains Mono,monospace}
*{box-sizing:border-box}
.b{border:1px solid rgba(255,204,51,.3);background:#080600;padding:12px}
.c{color:#ffcc33}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.cell{aspect-ratio:1;border:1px solid #ffcc3333;background:#ffcc3311;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cell.on{background:#ffcc33;color:#000;box-shadow:0 0 12px #ffcc33}
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
// ZONE minimal real - same as dein artifact - aber ohne React bloat
export const ZONE = {
  feld:{
    size:27,
    grid:(n=3)=>{const pts=[];for(let x=0;x<n;x++)for(let y=0;y<n;y++)for(let z=0;z<n;z++)pts.push({x,y,z,id:`${x}${y}${z}`,s8:`${x}→8→${y%3==0?9:3} — Seil`});return pts;},
    check:(pts)=>{
      const fps=ZONE.perf.fps();const zen=fps>=60?1:fps/60;const mana=Math.min(1,0.7984+zen*0.5);const aura=mana*zen;
      const cpu=(navigator.hardwareConcurrency||4)/8;const ram=(navigator.deviceMemory||8)/8;const rom=0.7984;const gpu=Math.min(1,fps/60+0.2);
      const move=(cpu+ram+rom+gpu+aura)/5;const good=move*100;const color=good>=70?"#ffcc33":good>=50?"#ff9933":"#ff3333";
      return pts.map(p=>({...p,aura:+(aura*100).toFixed(1),mana:+(mana*100).toFixed(1),zen:+(zen*100).toFixed(1),cpu:+(cpu*100).toFixed(1),ram:+(ram*100).toFixed(1),rom:79.84,gpu:+(gpu*100).toFixed(1),move:+good.toFixed(1),good:+good.toFixed(1),color,fps,eco:+(good*0.325).toFixed(2),tore:good>=70?"alle Tore offen GOOD 79.84":"Tore lahmt"}));
    }
  },
  BIO:{id:"BIO→CUBIK",cubik:{arg:32.29,xarg:0.254,arg3te:8.16,innen:27,eco:25.9,radiusFactor:0.348,color:"#ffcc33",good:79.84,regel:"81◆→△→27▣→3↺"}},
  perf:{_last:performance.now(),_frames:0,_fps:60,fps(){this._frames++;const n=performance.now(),d=n-this._last;if(d>=500){this._fps=Math.round(this._frames*1000/d);this._last=n;this._frames=0}return this._fps;}},
  check(){const pts=this.feld.grid(3);const checked=this.feld.check(pts);const g=checked[13]||checked[0];return{feld:checked,gesamt:g,tore:g.tore,good:g.good,color:g.color,text:`zone haben wir jetzt ein Feld — ${checked.length} Punkte — 27▣ — 9-1 — GOOD ${g.good} — aura mana zen cpu ram rom gpu move 60fps — 81◆→△→27▣→3↺`};}
};

// 6 ROMs - deine - minimal
export const D_ROM={id:'d',axis:'d',dir:'Osten Rechts',figur:6,beachtendes:6,pos:{x:1,y:0,z:0},color:0xff4444,note:'d.rom — d=6 Osten Rechts W(a(s(d)))'};
export const F_ROM={id:'f',axis:'a',dir:'Westen Links',figur:6,pos:{x:-1,y:0,z:0},color:0x44ff44,note:'f.rom — a=6 Westen Links W(a(s(d))) Figur'};
export const Q_ROM={id:'q',axis:'q',dir:'Quelle',figur:3,pos:{x:0,y:1,z:0},color:0xffff44,note:'q.rom — Quelle Drache Mann Mitte Vector Ring 3↺'};
export const X_ROM={id:'x',axis:'X',dir:'BREITE',best:'BEST?AXIS',pos:{x:1,y:0,z:0},color:0x77ddff,note:'x.rom BREITE X'};
export const Y_ROM={id:'y',axis:'Y',dir:'HOCH',best:'BEST?TMP',pos:{x:0,y:1,z:0},color:0xff77ff,note:'y.rom HOCH Y'};
export const Z_ROM={id:'z',axis:'Z',dir:'TIEFE',best:'BEST?LAGE',pos:{x:0,y:0,z:1},color:0x77ff77,note:'z.rom TIEFE Z'};

function render(){
  const {feld,gesamt}=ZONE.check();
  document.getElementById('root').innerHTML=`
    <div class="b"><span class="c">${gesamt.text}</span> — FPS ${gesamt.fps} — GOOD ${gesamt.good} — ${gesamt.tore} — <span style="color:${gesamt.color}">${gesamt.color}</span></div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:12px">
      ${[2,1,0].map(z=>`<div><div class="c">z=${z} ${z==2?'front':'z==0?back'}</div><div class="g">${feld.filter(p=>p.z==z).map(p=>`<div class="cell" style="background:${p.color}22;border-color:${p.color}88">${p.id}<br>${p.good}</div>`).join('')}</div></div>`).join('')}
    </div>
    <div class="b">f.rom central 6 ROMs W(a(s(d(himmeldeutung)))) W=9 a=6 s=6 d=6 d innen — X:32.29 Z:0.254 Y:8.16 R:0.348 #ffcc33 — 81◆→△→27▣→3↺ — BIO→CUBIK 62 1.92 0.005 8.2 87.42 GOOD — kein Ameisen sondern BIOS Hardware</div>
  `;
}
render();setInterval(render,250);
console.log(ZONE.check());
</script>
</body>
</html>
